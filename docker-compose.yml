# EPE3 — Base de datos PostgreSQL para MercadoNexo SpA
#
# Iniciar:     docker compose up -d
# Detener:     docker compose down
# Estado:      docker compose ps
# psql:        docker compose exec db psql -U ${POSTGRES_USER} -d ${POSTGRES_DB}
# Reset total: docker compose down -v   (borra el volumen de datos)
services:
  db:
    image: postgres:16-alpine
    container_name: mercadonexo-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mercadonexo}
      POSTGRES_USER: ${POSTGRES_USER:-mercadonexo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mercadonexo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mercadonexo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mercadonexo} -d ${POSTGRES_DB:-mercadonexo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mercadonexo_pgdata:
